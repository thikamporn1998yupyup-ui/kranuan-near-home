<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>กระนวนไรเดอร์ · ระบบแผนที่จริง</title>

<!-- Leaflet CSS สำหรับเรนเดอร์แผนที่ถนนจริง -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
@font-face{font-family:Seed;src:url("../assets/fonts/LINESeedSansTH_W_Rg.woff2") format("woff2");font-weight:400}
@font-face{font-family:Seed;src:url("../assets/fonts/LINESeedSansTH_W_Bd.woff2") format("woff2");font-weight:700}
*{box-sizing:border-box}
body{margin:0;background:#18191c;color:#f0f2f5;font:400 14px/1.6 Seed,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:480px;background:#1e2024;min-height:100vh;margin:auto;padding-bottom:85px;position:relative}

/* แถบบนสุดแบบพรีเมียม */
.topbar{padding:12px 16px;background:#25282e;display:flex;align-items:center;gap:10px;border-bottom:1px solid #32363e}
.rider-mini-avatar{width:38px;height:38px;border-radius:50%;overflow:hidden;background:#ef6264;display:grid;place-items:center;flex-shrink:0;color:white}
.topbar-info{flex:1;min-width:0}
.topbar strong{font-size:16px;display:block;color:#fff}
.topbar small{display:block;color:#9da4b0;font-size:10px;letter-spacing:.5px}

.online{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;color:#a0aab8;background:#18191c;padding:5px 10px;border-radius:20px}
.online i{width:8px;height:8px;border-radius:50%;background:#8a94a2}
.online i.on{background:#00e676;box-shadow:0 0 8px #00e67680}

/* ส่วนแสดงผลแผนที่ Leaflet จริง (Dark Mode Map) */
#realMapContainer{height:340px;width:100%;position:relative;background:#111214;z-index:1}
#realMap{height:100%;width:100%}

.maplabel{position:absolute;left:14px;top:14px;background:rgba(24, 25, 28, 0.85);backdrop-filter:blur(6px);padding:6px 12px;border-radius:8px;font-size:11px;color:#f0f2f5;z-index:1000;border:1px solid #32363e;font-weight:bold}
.mapbottom{position:absolute;bottom:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:8px;z-index:1000}
.mapbottom span{background:rgba(30, 32, 36, 0.9);backdrop-filter:blur(6px);padding:8px 12px;border-radius:10px;font-size:11px;color:#e1e4e8;border:1px solid #3a3f47;box-shadow:0 4px 15px rgba(0,0,0,0.3)}

.content{padding:18px}
.sectiontitle{display:flex;justify-content:space-between;align-items:center;margin:5px 0 15px}
.sectiontitle h1{font-size:19px;margin:0;color:#fff}
.pill{font-size:10px;padding:4px 10px;border-radius:20px;background:#ef626425;color:#ef6264;border:1px solid #ef626440}
.card{padding:18px;background:#25282e;border:1px solid #32363e;border-radius:20px;margin:12px 0;box-shadow:0 4px 20px rgba(0,0,0,0.2)}
.jobhead{display:flex;align-items:center;gap:10px}
.avatar{display:grid;place-items:center;width:42px;height:42px;background:#ef626420;border-radius:50%;color:#ef6264}
.icon{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.jobhead strong{display:block;font-size:15px;color:#fff}
.muted{color:#9da4b0;font-size:11px}
.amount{font-weight:700;font-size:24px;margin-left:auto;color:#ff5252}
.timeline{margin:16px 0 12px;padding-left:9px}
.stop{border-left:1px dashed #4a505c;padding:0 0 18px 20px;position:relative;font-size:12px;color:#d1d5db}
.stop:last-child{border-left-color:transparent;padding-bottom:0}
.stop:before{content:"";width:8px;height:8px;border-radius:50%;background:#8a94a2;position:absolute;left:-4px;top:6px}
.stop:last-child:before{border-radius:2px;background:#ff5252}
.stop small{display:block;font-size:10px;color:#8a94a2;margin-top:3px}
.row{display:flex;gap:9px;align-items:center}.row>*{min-width:0;flex:1}
.primary,.secondary{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:12px;padding:12px 14px;font-size:13px;font-weight:bold;text-decoration:none}
.primary{background:#ef6264;color:white}.secondary{border:1px solid #4a505c;color:#e1e4e8;background:#2c3038}
button:disabled{opacity:.45;cursor:default}.full{width:100%}
.state{font-size:12px;background:#18191c;padding:10px;border-radius:10px;margin-bottom:12px;color:#ffb74d;border:1px solid #32363e}
label{display:block;font-size:12px;margin:10px 0;color:#e1e4e8}
input,select{width:100%;padding:10px;border:1px solid #3a3f47;border-radius:10px;background:#18191c;color:#fff;font-size:13px}
.pricegrid{display:grid;grid-template-columns:1fr auto;gap:7px;font-size:12px;color:#d1d5db}.pricegrid .total{border-top:1px solid #3a3f47;padding-top:9px;font-weight:700;font-size:17px;color:#ff5252}
.note{font-size:11px;background:#332a18;color:#ffd54f;padding:11px;border-radius:10px;line-height:1.7;border:1px solid #544322}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);display:flex;background:#25282e;border-top:1px solid #32363e;padding:10px 10px 14px;z-index:1000}
.nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;color:#8a94a2;font-size:10px}
.nav button.active{color:#ef6264;font-weight:bold}
h2{font-size:16px;margin:4px 0 14px;color:#fff}
details summary{cursor:pointer;font-size:12px;color:#8a94a2}
#notice:empty{display:none}#notice{font-size:12px;padding:12px;background:#332a18;color:#ffd54f;border-radius:10px;margin-bottom:10px}
.empty{text-align:center;padding:22px;color:#8a94a2;font-size:13px}
a{color:#ef6264}
.switch{margin:12px 0;display:flex;align-items:center;justify-content:space-between}
.switch button{border-radius:30px;padding:8px 16px;border:0;background:#00e67620;color:#00e676;font-size:12px;font-weight:bold;border:1px solid #00e67640}
@media(min-width:650px){.app{margin:20px auto;border-radius:27px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,0.5)}}

.earnings{background:linear-gradient(135deg,#ef6264,#b71c1c);color:white;border-radius:22px;padding:22px;box-shadow:0 8px 25px rgba(239,98,100,0.25)}
.earn-label{font-size:12px;opacity:.9}.earn-total{font-weight:700;font-size:48px;line-height:1.2;letter-spacing:-1px}
.earnings p{font-size:11px;margin:4px 0 16px;opacity:.8}
.earn-breakdown{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid rgba(255,255,255,0.2);padding-top:14px;gap:15px}
.earn-breakdown span{display:block;font-size:10px;opacity:.8}.earn-breakdown strong{font-size:20px}
.dash-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:16px 0}
.dash-stats button{background:#25282e;border:1px solid #32363e;border-radius:16px;padding:12px 5px;color:#fff}
.dash-stats strong{display:block;font-size:22px;color:#ef6264}.dash-stats span{font-size:10px;color:#8a94a2}
.linkbutton{border:0;background:none;color:#ef6264;font-size:12px}

/* ซ่อนแผนที่ SVG สมมติเดิม */
.map { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <!-- Topbar -->
  <header class="topbar">
    <div class="rider-mini-avatar">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
    </div>
    <div class="topbar-info">
      <strong>ไรเดอร์กระนวน</strong>
      <small>LOCAL DELIVERY PARTNER</small>
    </div>
    <div class="online" id="onlineBadge"></div>
  </header>

  <!-- Container แสดงแผนที่ถนนจริง (Leaflet Real Map - Dark Mode) -->
  <div id="realMapContainer">
    <div id="realMap"></div>
    <div class="maplabel">📍 GPS ติดตามตำแหน่งจริง</div>
    <div class="mapbottom">
      <span id="mapAreaText">กระนวน · ขอนแก่น</span>
      <span id="mapGpsStatus" style="color:#00e676;font-weight:bold;">กำลังค้นหาสัญญาณ GPS...</span>
    </div>
  </div>

  <!-- Content -->
  <main class="content">
    <div id="notice" role="status"></div>
    <div id="screen"></div>
    <details class="card">
      <summary>ข้อมูลระบบแผนที่จริง</summary>
      <p class="muted">ระบบดึงแผนที่ถนนจริงจาก OpenStreetMap พร้อมแสดงพิกัด GPS จริงของไรเดอร์และตำแหน่งจัดส่ง</p>
      <a href="../index.html">กลับแอพชุมชน</a>
    </details>
  </main>
  
  <nav class="nav" id="nav"></nav>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="../assets/delivery-pricing.js"></script>
<script src="rider.js"></script>
<script src="personal.js"></script>

<script>
  let leafletMap = null;
  let riderMarker = null;

  // เริ่มต้นสร้างแผนที่จริง Dark Mode
  function initRealMap() {
    if (leafletMap) return;

    // พิกัดเริ่มต้น (อ.กระนวน ขอนแก่น)
    const defaultLat = 16.706;
    const defaultLng = 103.078;

    leafletMap = L.map('realMap', {
      zoomControl: false,
      attributionControl: false
    }).setView([defaultLat, defaultLng], 15);

    // ใช้ CartoDB Dark Matter Tiles (แผนที่ธีมสีดำเหมือนสไตล์แอป Taxi/Delivery)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      subdomains: 'abcd'
    }).addTo(leafletMap);

    // ไอคอนหมุดไรเดอร์
    const riderIcon = L.divIcon({
      className: 'custom-rider-pin',
      html: `<div style="background:#ef6264;width:24px;height:24px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 12px #ef6264;"></div>`,
      iconSize: [24, 24],
      iconAnchor: [12, 12]
    });

    riderMarker = L.marker([defaultLat, defaultLng], { icon: riderIcon }).addTo(leafletMap);
  }

  // อัปเดตพิกัด GPS จริงเข้าแผนที่
  function watchRiderLocation() {
    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;

          initRealMap();

          if (leafletMap && riderMarker) {
            const newPos = [lat, lng];
            riderMarker.setLatLng(newPos);
            leafletMap.panTo(newPos);

            document.getElementById('mapGpsStatus').textContent = `พิกัดสด: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
          }
        },
        (err) => {
          document.getElementById('mapGpsStatus').textContent = "กรุณาเปิดสิทธิ์ GPS บนอุปกรณ์";
          document.getElementById('mapGpsStatus').style.color = "#ff5252";
          initRealMap();
        },
        { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
      );
    } else {
      initRealMap();
    }
  }

  window.addEventListener('DOMContentLoaded', () => {
    initRealMap();
    watchRiderLocation();
  });
</script>
</body>
</html>
