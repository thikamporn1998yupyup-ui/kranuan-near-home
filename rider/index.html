<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>กระนวนไรเดอร์ · ต้นแบบ</title>
<style>
@font-face{font-family:Seed;src:url("../assets/fonts/LINESeedSansTH_W_Rg.woff2") format("woff2");font-weight:400}
@font-face{font-family:Seed;src:url("../assets/fonts/LINESeedSansTH_W_Bd.woff2") format("woff2");font-weight:700}
*{box-sizing:border-box}body{margin:0;background:#eef0f1;color:#232934;font:400 14px/1.6 Seed,sans-serif}button,input,select{font:inherit}button,a,input:focus-visible{outline-color:#ed5c5f}button{cursor:pointer}
.app{max-width:480px;background:#f9fafb;min-height:100vh;margin:auto;padding-bottom:85px}

/* แถบบนสุด: รูปโปรไฟล์ไรเดอร์ขนาดเล็ก + ชื่อ + สถานะออนไลน์ */
.topbar{padding:12px 16px;background:white;display:flex;align-items:center;gap:10px;border-bottom:1px solid #eee}
.rider-mini-avatar{width:36px;height:36px;border-radius:50%;overflow:hidden;background:#fce7e5;display:grid;place-items:center;flex-shrink:0}
.rider-mini-avatar img, .rider-mini-avatar svg{width:100%;height:100%;object-fit:cover}
.topbar-info{flex:1;min-width:0}
.topbar strong{font-size:16px;display:block}
.topbar small{display:block;color:#8c929b;font-size:10px;letter-spacing:.5px}

.online{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:11px;color:#697e72}
.online i{width:7px;height:7px;border-radius:50%;background:#9caaa2}
.online i.on{background:#2d9d70}

/* บังคับแสดงแผนที่ตรงกลางตลอดเวลา ไม่ให้ถูกซ่อน */
.map{height:280px;position:relative;background:#e7ece9;overflow:hidden;border-bottom:1px solid #e8eaee;display:block !important;}
.map svg{width:100%;height:100%}
.maplabel{position:absolute;left:16px;top:12px;background:#fffdf4ed;padding:5px 9px;border-radius:7px;font-size:10px;color:#7d7052}
.mapbottom{position:absolute;bottom:14px;left:16px;right:16px;display:flex;justify-content:space-between;gap:6px}
.mapbottom span{background:white;padding:7px 11px;border-radius:8px;font-size:11px;box-shadow:0 3px 12px #1a213510}

.content{padding:18px}
.sectiontitle{display:flex;justify-content:space-between;align-items:center;margin:5px 0 15px}
.sectiontitle h1{font-size:20px;margin:0}
.pill{font-size:10px;padding:5px 9px;border-radius:20px;background:#fce6e6;color:#c34d50}
.card{padding:18px;background:white;border:1px solid #e8eaee;border-radius:20px;margin:12px 0;box-shadow:0 4px 18px #18223704}
.jobhead{display:flex;align-items:center;gap:10px}
.avatar{display:grid;place-items:center;width:43px;height:43px;background:#fce7e5;border-radius:50%;color:#ea6062}
.icon{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.jobhead strong{display:block;font-size:15px}
.muted{color:#8a909a;font-size:11px}
.amount{font-weight:700;font-size:24px;margin-left:auto;color:#e35b5e}
.timeline{margin:18px 0 12px;padding-left:9px}
.stop{border-left:1px dashed #cfd4da;padding:0 0 19px 20px;position:relative;font-size:12px}
.stop:last-child{border-left-color:transparent;padding-bottom:0}
.stop:before{content:"";width:8px;height:8px;border-radius:50%;background:#344258;position:absolute;left:-4px;top:6px}
.stop:last-child:before{border-radius:2px;background:#ef6565}
.stop small{display:block;font-size:10px;color:#9096a0;margin-top:4px}
.row{display:flex;gap:9px;align-items:center}.row>*{min-width:0;flex:1}
.primary,.secondary{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:10px;padding:12px 14px;font-size:13px;text-decoration:none}
.primary{background:#ef6264;color:white}.secondary{border:1px solid #f0c6c7;color:#d9595b;background:white}
button:disabled{opacity:.45;cursor:default}.full{width:100%}
.state{font-size:12px;background:#f2f5f8;padding:10px;border-radius:9px;margin-bottom:12px}
label{display:block;font-size:12px;margin:10px 0}input,select{width:100%;padding:10px;border:1px solid #e1e4e9;border-radius:9px;background:white;font-size:13px}
.pricegrid{display:grid;grid-template-columns:1fr auto;gap:7px;font-size:12px}.pricegrid .total{border-top:1px solid #eceef1;padding-top:9px;font-weight:700;font-size:17px}
.note{font-size:11px;background:#fff4d9;color:#927133;padding:11px;border-radius:10px;line-height:1.7}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);display:flex;background:white;border-top:1px solid #eee;padding:12px 10px 16px;z-index:5}
.nav button{flex:1;border:0;background:white;display:flex;flex-direction:column;align-items:center;gap:4px;color:#8d929c;font-size:10px}
.nav button.active{color:#e75e61}
h2{font-size:17px;margin:4px 0 14px}
details summary{cursor:pointer;font-size:12px;color:#8d939c}
#notice:empty{display:none}#notice{font-size:12px;padding:12px;background:#fff3d8;border-radius:10px}
.empty{text-align:center;padding:22px;color:#838994;font-size:13px}
a{color:#d3575c}
.switch{margin:12px 0;display:flex;align-items:center;justify-content:space-between}
.switch button{border-radius:30px;padding:8px 15px;border:0;background:#e5eee8;color:#46755a;font-size:12px}
@media(min-width:650px){.app{margin:20px auto;border-radius:27px;overflow:hidden}}

.earnings{background:linear-gradient(120deg,#ef6366,#d84651);color:white;border-radius:23px;padding:24px;box-shadow:0 9px 25px #e75e6125}
.earn-label{font-size:13px;opacity:.9}.earn-total{font-weight:700;font-size:51px;line-height:1.5;letter-spacing:-1px}
.earnings p{font-size:12px;margin:0 0 17px;color:#ffe5e5}
.earn-breakdown{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #ffffff40;padding-top:15px;gap:15px}
.earn-breakdown span{display:block;font-size:11px;color:#ffdfe1}.earn-breakdown strong{font-size:21px}
.dash-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0}
.dash-stats button{background:white;border:1px solid #e7e9ed;border-radius:15px;padding:14px 5px;color:#313a48}
.dash-stats strong{display:block;font-size:25px}.dash-stats span{font-size:11px;color:#87909d}
.linkbutton{border:0;background:none;color:#d6535a;font-size:12px}
.app{--r-bg:#f8f9fb;--r-panel:#fff;--r-ink:#253041;--r-muted:#758090;--r-accent:#ef6264;--r-accent-ink:#fff;background:var(--r-bg);color:var(--r-ink)}
.topbar,.card,.nav,.nav button,.dash-stats button,input,select{background:var(--r-panel);color:var(--r-ink)}
.nav button{color:var(--r-muted)}.muted,.topbar small{color:var(--r-muted)}
.primary{background:var(--r-accent);color:var(--r-accent-ink)}
.secondary,.linkbutton,.amount,.nav button.active{color:var(--r-accent)}
.earnings{background:var(--r-accent);color:var(--r-accent-ink)}
.earnings p,.earn-breakdown span{color:inherit;opacity:.85}
.personal-card{display:flex;align-items:center;gap:16px;background:var(--r-panel);border:1px solid #87929e25;border-radius:22px;padding:16px;margin-bottom:15px}
.personal-card>div:last-child{flex:1;min-width:0}.personal-card strong{font-size:19px}.personal-card p{font-size:11px;color:var(--r-muted);margin:6px 0;overflow-wrap:anywhere}
.portrait{width:91px;height:105px;flex-shrink:0;border-radius:20px;overflow:hidden;background:#e9eef5}.portrait svg{width:100%;height:100%}.profile-photo{width:100%;height:100%;object-fit:cover}
.verified-badge{display:inline-flex;align-items:center;gap:4px;color:#1677d2;font-size:11px;font-weight:700}.verified-badge svg{width:20px;height:20px;flex-shrink:0}.verified-badge small{font-size:9px;color:#687e94}
.work-card{background:var(--r-panel);border:1px solid #87929e25;border-radius:20px;padding:18px;margin-bottom:20px}
.work-clock{font-size:38px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px}
.wellbeing{background:#eaf1e7;color:#48603b;border-radius:12px;padding:13px;margin:15px 0}.wellbeing strong{font-size:13px}.wellbeing p{font-size:11px;line-height:1.65;margin:5px 0 0}
.hunger-button{border:0;background:none;color:var(--r-accent);font-size:12px;padding:13px 0 0}
.avatar-preview{height:210px;width:180px;background:#e9eef5;border-radius:20px;overflow:hidden;margin:18px auto}.avatar-preview svg{height:100%;width:100%}
#profileForm input[type=color]{height:44px;padding:4px}.photo-upload{border:1px dashed #92a2b4;border-radius:10px;padding:12px}
.state{color:var(--r-ink);background:var(--r-bg)}.dash-stats span{color:var(--r-muted)}.dash-stats button{border-color:#87929e30}
</style>
</head>
<body>
<div class="app">
  <!-- แถบบนสุด: รูปโปรไฟล์ไรเดอร์ขนาดเล็ก + ชื่อ + สถานะออนไลน์ -->
  <header class="topbar">
    <div class="rider-mini-avatar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
    </div>
    <div class="topbar-info">
      <strong>ไรเดอร์กระนวน</strong>
      <small>LOCAL DELIVERY PARTNER</small>
    </div>
    <div class="online" id="onlineBadge"></div>
  </header>

  <!-- แผนที่ตำแหน่งปัจจุบันขนาดใหญ่ตรงกลาง (บังคับแสดงตลอดเวลา) -->
  <section class="map" aria-label="ผังตำแหน่งปัจจุบันของไรเดอร์">
    <svg viewBox="0 0 480 270" preserveAspectRatio="xMidYMid slice">
      <rect width="480" height="270" fill="#e8eee9"/>
      <g fill="#dbe6d9">
        <rect x="20" y="20" width="90" height="65" rx="9"/>
        <rect x="205" y="15" width="90" height="75" rx="9"/>
        <rect x="345" y="145" width="90" height="90" rx="9"/>
        <rect x="90" y="160" width="110" height="60" rx="9"/>
      </g>
      <path d="M-30 210 210 0M100 290 385 0M-20 75l520 100M-20 140l520 100" fill="none" stroke="#fff" stroke-width="16"/>
      <path d="M350 0q-70 80-30 150t-40 120" fill="none" stroke="#bfdbdd" stroke-width="23"/>
      <path d="m85 190 83-73 65 13 99-90" fill="none" stroke="#ed6968" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 6"/>
      <circle cx="85" cy="190" r="13" fill="#fff"/>
      <circle cx="85" cy="190" r="7" fill="#4378ad"/>
      <circle cx="168" cy="117" r="10" fill="#303f54"/>
      <circle cx="168" cy="117" r="4" fill="white"/>
      <path d="M332 20c-12 0-19 9-19 20 0 16 19 30 19 30s19-14 19-30c0-11-7-20-19-20" fill="#ef6264"/>
      <circle cx="332" cy="38" r="6" fill="white"/>
      <text x="55" y="225" fill="#5e7790" font-size="11">ตำแหน่งไรเดอร์</text>
      <text x="155" y="102" fill="#586475" font-size="11">จุดรับ</text>
      <text x="351" y="43" fill="#9a585a" font-size="11">ลูกค้า</text>
    </svg>
    <div class="maplabel">ตำแหน่ง GPS ปัจจุบัน</div>
    <div class="mapbottom">
      <span>กระนวน · ขอนแก่น</span>
      <span id="mapDistance">กำลังโหลดพิกัด GPS...</span>
    </div>
  </section>

  <!-- เนื้อหาแดชบอร์ดและการทำงานด้านล่าง -->
  <main class="content">
    <div id="notice" role="status"></div>
    <div id="screen"></div>
    <details class="card">
      <summary>ข้อมูลเกี่ยวกับต้นแบบ</summary>
      <p class="muted">แอพไรเดอร์แยกจากแอพชุมชน ใช้ข้อมูลจำลองร่วมกันเฉพาะเบราว์เซอร์ต้นทางเดียวกัน</p>
      <a href="../index.html">กลับแอพชุมชน</a>
    </details>
  </main>
  
  <nav class="nav" id="nav"></nav>
</div>

<script src="../assets/delivery-pricing.js"></script>
<script src="rider.js"></script>
<script src="personal.js"></script>
<script>
  // 📍 สคริปต์ขอสิทธิ์เข้าถึงพิกัด GPS ทันทีที่เปิดลิงก์ไรเดอร์
  window.addEventListener('DOMContentLoaded', () => {
    // ป้องกันไม่ให้ไฟล์ rider.js สั่งซ่อนแผนที่
    setInterval(() => {
      const mapEl = document.querySelector('.map');
      if (mapEl) {
        mapEl.hidden = false;
        mapEl.style.display = 'block';
      }
    }, 50);

    // ขอพิกัด GPS ทันทีอัตโนมัติ
    if ("geolocation" in navigator) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          console.log("📍 ดึงพิกัดไรเดอร์สำเร็จ:", lat, lng);
          const distEl = document.getElementById('mapDistance');
          if (distEl) {
            distEl.textContent = "พิกัด GPS พร้อมใช้งาน (" + lat.toFixed(4) + ", " + lng.toFixed(4) + ")";
          }
        },
        (err) => {
          console.warn("ไม่สามารถดึงพิกัดได้:", err.message);
          const distEl = document.getElementById('mapDistance');
          if (distEl) {
            distEl.textContent = "กรุณาเปิดสิทธิ์ GPS เพื่อใช้งาน";
          }
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    }
  });
</script>
</body>
</html>
