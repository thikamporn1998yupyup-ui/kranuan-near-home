<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>กระนวนใกล้บ้าน · ส่งของพรีเมียม</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
:root{--primary:#e95e2f;--primary-dark:#c84c23;--bg:#f8f5f0;--card:#fff;--text:#2d241e;--muted:#8a7b6b;--border:#ede3d5;--radius:20px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.phone{max-width:480px;margin:auto;background:#fffcf9;min-height:100vh;box-shadow:0 0 50px rgba(0,0,0,0.06);padding-bottom:100px;position:relative;overflow-x:hidden}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
main{animation:fadeIn 0.25s ease-out;padding:20px}

/* Header ดีไซน์หรู */
.top{background:linear-gradient(135deg, #f9d35b 0%, #f4bc3f 100%);padding:20px 22px;border-radius:0 0 32px 32px;box-shadow:0 4px 20px rgba(244,188,63,0.2)}
.brandline{display:flex;align-items:center;justify-content:space-between}
.brand-left{display:flex;align-items:center;gap:12px}
.logo-badge{width:42px;height:42px;background:#fff;border-radius:14px;display:grid;place-items:center;font-weight:bold;color:var(--primary);font-size:20px;box-shadow:0 4px 10px rgba(0,0,0,0.05)}
.eyebrow{font-size:9px;letter-spacing:1.5px;font-weight:bold;color:#856342;text-transform:uppercase}
.line-profile-btn{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.9);padding:5px 12px;border-radius:24px;font-size:11px;font-weight:bold;color:#443720}
.line-avatar{width:26px;height:26px;border-radius:50%;object-fit:cover;background:#00b900;display:grid;place-items:center;color:white;font-size:10px}

/* หน้าส่งของสไตล์พรีเมียม */
.delivery-container{display:flex;flex-direction:column;gap:16px}
.delivery-banner{background:linear-gradient(135deg, #2d241e 0%, #483931 100%);color:white;border-radius:24px;padding:22px;position:relative;overflow:hidden;box-shadow:0 10px 25px rgba(45,36,30,0.15)}
.delivery-banner h2{margin:0 0 6px;font-size:20px;letter-spacing:-0.5px}
.delivery-banner p{margin:0;font-size:12px;color:#d5c5b8}

/* การ์ดฟอร์มพรีเมียม */
.card-glass{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:0 4px 20px rgba(0,0,0,0.02)}
.section-title{font-size:15px;font-weight:700;margin:0 0 14px;display:flex;align-items:center;gap:8px}

.loc-input-group{display:flex;flex-direction:column;gap:10px;position:relative}
.loc-input-group::before{content:'';position:absolute;left:15px;top:38px;bottom:38px;width:2px;background:var(--border);z-index:0}

.loc-row{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.loc-dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;font-size:12px;box-shadow:0 3px 8px rgba(0,0,0,0.08)}
.loc-dot.pickup{background:#e3fcef;color:#00a854}
.loc-dot.drop{background:#ffebe6;color:var(--primary)}

.loc-field{flex:1;background:#faf7f2;border:1px solid var(--border);border-radius:14px;padding:10px 14px;transition:all 0.2s}
.loc-field:focus-within{border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px rgba(233,94,47,0.08)}
.loc-field label{font-size:10px;font-weight:bold;color:var(--muted);display:block;margin-bottom:2px;text-transform:uppercase}
.loc-field input{border:0;background:none;width:100%;font-size:13px;color:var(--text);outline:none}

/* อัปโหลดรูปภาพหน้าบ้าน */
.upload-box{border:2px dashed var(--border);border-radius:16px;padding:16px;text-align:center;background:#faf7f2;cursor:pointer;transition:all 0.2s;position:relative}
.upload-box:hover{border-color:var(--primary);background:#fff5f2}
.upload-preview{width:100%;height:120px;object-fit:cover;border-radius:10px;display:none;margin-top:10px}

/* ปุ่มหลัก */
.btn-primary{background:linear-gradient(135deg, var(--primary) 0%, #d8481a 100%);color:white;border:0;border-radius:16px;padding:15px;font-size:14px;font-weight:bold;width:100%;box-shadow:0 6px 20px rgba(233,94,47,0.3);transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-primary:active{transform:scale(0.98)}

/* เมนูด้านล่าง */
.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);display:grid;grid-template-columns:repeat(5,1fr);background:#2d241e;border-radius:24px 24px 0 0;padding:12px 8px 20px;z-index:10;box-shadow:0 -10px 30px rgba(0,0,0,0.1)}
.bottomnav button{border:0;background:none;color:#a89a8e;font-size:10px;display:flex;align-items:center;flex-direction:column;gap:4px;font-weight:bold;transition:color 0.2s}
.bottomnav button.active{color:var(--primary)}
.icon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* อื่นๆ */
.card{padding:18px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin:12px 0}
.badge{display:inline-block;font-size:10px;background:#fff0cd;color:#a76d2c;padding:4px 8px;border-radius:7px;font-weight:bold}
.status{background:#fff0ce;color:#915425;padding:10px;border-radius:10px;font-size:12px}
.empty{padding:30px;text-align:center;border:2px dashed var(--border);border-radius:var(--radius);font-size:13px;color:var(--muted)}
#notice:empty{display:none}
#notice{background:#fff3cd;color:#856404;padding:12px 16px;border-radius:12px;font-size:12px;margin-bottom:15px;border:1px solid #ffeeba}
</style>
</head>
<body>

<div class="phone">
  <header class="top">
    <div class="brandline">
      <div class="brand-left">
        <div class="logo-badge">ก</div>
        <div>
          <div class="eyebrow">KRANUAN EXPRESS</div>
          <strong style="font-size:18px">กระนวนใกล้บ้าน</strong>
        </div>
      </div>
      <div class="line-profile-btn" onclick="openProfileSettings()">
        <img id="headerUserAvatar" class="line-avatar" src="" alt="User" style="display:none;">
        <div id="headerUserAvatarPlaceholder" class="line-avatar">U</div>
        <span id="headerUserName">เข้าสู่ระบบ</span>
      </div>
    </div>
  </header>
  
  <main>
    <div id="notice" role="status"></div>
    <div id="app"></div>
  </main>
  
  <nav id="nav" class="bottomnav" aria-label="เมนูหลัก"></nav>
</div>

<script src="assets/delivery-pricing.js"></script>
<script>
const areaId='khon-kaen-kranuan',key='kranuan-isolated-demo-v2';
let state={orders:[],rider:'none',currentUser:null};
try{let s=JSON.parse(localStorage.getItem(key));if(s&&Array.isArray(s.orders))state={...state,...s}}catch{}
let view='ส่งของ';
let userLiveLocation = { lat: 16.706, lng: 103.078 };

function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{}render()}

function render(){
  const appEl=document.getElementById('app');
  if(!appEl)return;
  
  let h='';
  if(view==='ส่งของ'){
    h=`
    <div class="delivery-container">
      <div class="delivery-banner">
        <h2>ส่งพัสดุ & เดลิเวอรีด่วน</h2>
        <p>บริการรับส่งสิ่งของ อาหาร เอกสาร ทั่วอำเภอกระนวน ปลอดภัย รวดเร็ว</p>
      </div>

      <form class="card-glass" onsubmit="submitRealDelivery(event)">
        <div class="section-title">
          <svg class="icon" style="color:var(--primary)" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          กำหนดจุดรับ-ส่งสินค้า
        </div>

        <div class="loc-input-group">
          <div class="loc-row">
            <div class="loc-dot pickup">📍</div>
            <div class="loc-field">
              <label>จุดรับของ (ต้นทาง)</label>
              <input name="pickupLoc" required placeholder="เช่น ตลาดสดเทศบาล, ร้านค้าในอำเภอ">
            </div>
          </div>

          <div class="loc-row" style="margin-top:8px">
            <div class="loc-dot drop">🎯</div>
            <div class="loc-field">
              <label>จุดส่งของ (ปลายทาง / GPS ปัจจุบัน)</label>
              <input name="dropLoc" required placeholder="บ้านเลขที่ / ชื่อหมู่บ้าน / จุดสังเกต">
            </div>
          </div>
        </div>

        <div style="margin-top:18px">
          <div class="section-title" style="font-size:13px;margin-bottom:8px">รายละเอียดพัสดุ</div>
          <div class="loc-field" style="margin-bottom:12px">
            <label>ชื่อสิ่งของ / ประเภท</label>
            <input name="itemDesc" required placeholder="เช่น เอกสารสำคัญ, กล่องพัสดุ, อาหารกล่อง">
          </div>
          
          <div class="loc-field">
            <label>หมายเหตุเพิ่มเติมถึงไรเดอร์ (ถ้ามี)</label>
            <input name="itemNote" placeholder="เช่น ฝากไว้หน้าบ้าน, บ้านรั้วสีขาว, โทรหาก่อนถึง">
          </div>
        </div>

        <div style="margin-top:18px">
          <div class="section-title" style="font-size:13px;margin-bottom:8px">แนบรูปถ่ายหน้าบ้าน / จุดส่งของ</div>
          <div class="upload-box" onclick="document.getElementById('houseImageInput').click()">
            <svg class="icon" style="width:28px;height:28px;color:var(--muted);margin-bottom:4px" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            <div style="font-size:12px;font-weight:bold;color:var(--muted)" id="uploadText">คลิกเพื่ออัปโหลดรูปภาพหน้าบ้าน</div>
            <input type="file" id="houseImageInput" accept="image/*" style="display:none" onchange="previewHouseImage(event)">
            <img id="housePreview" class="upload-preview" alt="Preview">
          </div>
        </div>

        <button type="submit" class="btn-primary" style="margin-top:22px">
          <svg class="icon" style="width:20px;height:20px" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          ยืนยันเรียกไรเดอร์มารับของทันที
        </button>
      </form>
    </div>`;
  } else if(view==='ออเดอร์ของฉัน'){
    h=`<h2>งานและออเดอร์ของฉัน</h2>`+ordersHtml();
  } else {
    h=`<h2>หน้าแรก</h2><p class="muted">เลือกเมนูด้านล่างเพื่อใช้งานบริการจัดส่งและตลาดชุมชน</p>`;
  }

  appEl.innerHTML=h;
  topNav();
}

let uploadedImageBase64 = '';
function previewHouseImage(event){
  const file = event.target.files[0];
  if(file){
    const reader = new FileReader();
    reader.onload = function(e){
      uploadedImageBase64 = e.target.result;
      const preview = document.getElementById('housePreview');
      preview.src = uploadedImageBase64;
      preview.style.display = 'block';
      document.getElementById('uploadText').textContent = 'เปลี่ยนรูปภาพ';
    }
    reader.readAsDataURL(file);
  }
}

function submitRealDelivery(e){
  e.preventDefault();
  const data = new FormData(e.target);
  state.orders.push({
    id: Date.now().toString(36),
    areaId,
    status: 'ready',
    type: 'delivery',
    item: data.get('itemDesc'),
    pickup: data.get('pickupLoc'),
    drop: data.get('dropLoc'),
    note: data.get('itemNote') || 'ไม่มีหมายเหตุ',
    image: uploadedImageBase64,
    deliveryFee: 30,
    coordinates: { pickup:{lat:16.706, lng:103.078}, drop:userLiveLocation }
  });
  uploadedImageBase64 = '';
  view='ออเดอร์ของฉัน';
  save();
  document.getElementById('notice').textContent='สร้างคำขอส่งของสำเร็จ! ไรเดอร์กำลังตรวจสอบเส้นทาง';
}

function ordersHtml(){
  return state.orders.filter(o=>o.areaId===areaId).map(o=>`
    <article class="card">
      <span class="badge">งานส่งด่วน</span>
      <h3 style="margin:6px 0">${escapeHtml(o.item)}</h3>
      <p style="font-size:12px;margin:2px 0">📍 รับ: ${escapeHtml(o.pickup)}</p>
      <p style="font-size:12px;margin:2px 0">🎯 ส่ง: ${escapeHtml(o.drop)}</p>
      <p style="font-size:12px;margin:2px 0;color:var(--muted)">📝 หมายเหตุ: ${escapeHtml(o.note)}</p>
      ${o.image ? `<img src="${o.image}" style="width:100%;height:100px;object-fit:cover;border-radius:10px;margin-top:8px;" alt="รูปหน้าบ้าน">`:''}
      <p class="status" style="margin-top:10px">สถานะ: รอไรเดอร์มารับสินค้า</p>
      <button onclick="cancelOrder('${o.id}')" style="background:#ff4d4f;color:white;border:0;border-radius:8px;padding:8px 12px;font-size:11px;font-weight:bold;width:100%;margin-top:8px">ยกเลิกคำขอ</button>
    </article>
  `).join('') || '<p class="empty">ยังไม่มีรายการส่งของในขณะนี้</p>';
}

function cancelOrder(id){
  state.orders = state.orders.filter(o=>o.id!==id);
  save();
  document.getElementById('notice').textContent='ยกเลิกคำขอเรียบร้อยแล้ว';
}

const paths={
  home:'<path d="m3 11 9-8 9 8M5 10v11h5v-7h4v7h5V10"/>',
  rider:'<circle cx="5" cy="18" r="3"/><circle cx="19" cy="18" r="3"/><path d="M5 18h7l-3-8H5m4 0h7l3 8M15 4h3l2 7M3 7h7M4 3h5"/>',
  orders:'<rect x="5" y="4" width="14" height="18" rx="2"/><path d="M9 2h6v5H9zM9 12h6M9 16h6"/>',
  market:'<path d="M3 4h9l9 9-9 9-9-9V4Z"/><circle cx="8" cy="9" r="1.5"/><path d="m13 12 4 4m-7-1 4 4"/>'
};
function icon(k){return '<svg class="icon" viewBox="0 0 24 24">'+paths[k]+'</svg>'}

function go(v){view=v;render();window.scrollTo({top:0,behavior:'smooth'});}

function topNav(){
  const navEl=document.getElementById('nav');
  if(!navEl)return;
  navEl.innerHTML=[['ร้านค้า','home','หน้าแรก'],['ตลาด','market','ตลาด'],['ออเดอร์ของฉัน','orders','งานของฉัน'],['ส่งของ','rider','ส่งของ']].map(([vName,k,l])=>`
    <button class="${view===vName?'active':''}" onclick="go('${vName}')">${icon(k)}${l}</button>
  `).join('');
}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

window.addEventListener('DOMContentLoaded', ()=>{
  render();
});
</script>
</body>
</html>
