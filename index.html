<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>กระนวนใกล้บ้าน · ต้นแบบ</title>
<style>
@font-face{font-family:"LINE Seed Sans TH";src:url("assets/fonts/LINESeedSansTH_W_Rg.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"LINE Seed Sans TH";src:url("assets/fonts/LINESeedSansTH_W_Bd.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
*{box-sizing:border-box}
body{margin:0;background:#f6eee6;color:#332e29;font:400 15px/1.65 "LINE Seed Sans TH",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #1e7470;outline-offset:3px}
.phone{max-width:480px;margin:auto;background:#fffcf6;min-height:100vh;box-shadow:0 0 65px #49321c12;padding-bottom:90px}
.top{background:#f9d35b;padding:24px 22px 28px;border-radius:0 0 30px 30px}
.brandline{display:flex;align-items:center;gap:11px}
.logo{width:56px;height:56px}
.brandline strong{font-size:19px}
.eyebrow{font-size:10px;letter-spacing:1.5px;font-weight:bold;color:#856342}
.top h1{font-size:29px;line-height:1.35;margin:24px 0 8px;letter-spacing:-1px}
.top p{margin:0;color:#765b2b;font-size:12px}
.location{display:flex;align-items:center;gap:5px;margin-top:13px;font-size:11px}
.searchbox{display:flex;gap:10px;background:#fffdf4;border-radius:14px;padding:4px 13px;margin-top:20px;align-items:center}
.searchbox input{border:0;background:none;padding:12px 0;min-width:0;flex:1}
.icon{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
main{padding:21px 20px}
h2{font-size:19px;margin:0 0 16px}
h3{font-size:15px;line-height:1.5;margin:10px 0 6px}
p{line-height:1.7}
.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:22px 0 14px}
.sectionhead h2{margin:0}
.textbtn{border:0;background:none;color:#d85228;font-size:12px;padding:6px}
.categories{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.category{border:0;background:none;padding:0;color:#655444;font-size:10px}
.category span{display:grid;place-items:center;width:52px;height:56px;border-radius:19px;background:#fff1ca;color:#cf6840;margin:0 auto 8px;border:1px solid #f5e5b6}
.category .icon{width:30px;height:30px}
.category.selected span{background:#e95e30;color:white;border-color:#e95e30}
.ad{position:relative;display:flex;overflow:hidden;background:#e95c2c;border-radius:22px;min-height:158px;color:white;margin-top:24px;padding:20px}
.adcopy{position:relative;z-index:1;width:65%}
.ad small{font-size:9px;letter-spacing:1.2px;color:#ffdfc9}
.ad h2{font-size:22px;line-height:1.4;margin:10px 0}
.ad p{font-size:11px;margin:0;color:#ffe8d5}
.ad svg.art{position:absolute;right:-12px;bottom:-15px;width:185px;height:165px}
.ad button{border:0;color:#93401f;background:#ffe5b0;border-radius:20px;padding:7px 12px;font-size:11px;margin-top:8px}
.dots{text-align:center;margin:10px;color:#e55b2d;letter-spacing:4px;font-size:9px}
.shopgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.shop{border:1px solid #f0e6d9;border-radius:18px;background:white;overflow:hidden}
.shopbody{padding:12px}
.shop h3{font-size:13px;margin:4px 0}
.shop p{font-size:10px;color:#8a7b6b;margin:5px 0}
.cover{height:118px;background:#f5e7c8;position:relative;display:grid;place-items:center}
.cover>svg{width:150px;height:115px}
.sampletag{position:absolute;left:8px;top:8px;border-radius:6px;background:#ffffffdf;padding:4px 6px;font-size:9px;color:#7f6d57}
.price{font-size:14px;color:#d8592f;font-weight:bold}
.shop button,.card button,.primary{border:0;border-radius:10px;background:#e95d2f;color:white;padding:10px 12px;font-size:12px;margin-top:8px}
.shop button{width:100%}
.card{padding:19px;background:white;border:1px solid #eee2d3;border-radius:18px;margin:12px 0}
.muted{color:#918373;font-size:11px}
.badge{display:inline-block;font-size:10px;background:#fff0cd;color:#a76d2c;padding:6px 9px;border-radius:7px}
.status{background:#fff0ce;color:#915425;padding:11px;border-radius:10px}
.newsrow{display:flex;align-items:center;gap:12px;background:#f4ecd9;border-radius:17px;padding:17px}
.newsrow>.icon{width:35px;height:35px;color:#bc713b}
.newsrow h3{margin:0;font-size:13px}
.newsrow p{font-size:10px;margin:4px 0}
.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);display:grid;grid-template-columns:repeat(5,1fr);background:#e95e2f;border-radius:23px 23px 0 0;padding:11px 8px 16px;z-index:10}
.bottomnav button{border:0;background:none;color:#ffe4bf;font-size:9px;display:flex;align-items:center;flex-direction:column;gap:6px;padding:3px}
.bottomnav button.active{color:white}
.bottomnav button.active .icon{stroke-width:2.4}
.demo{margin:24px 0 0;border-top:1px dashed #e5d8c5;padding-top:15px}
.demo summary{font-size:11px;color:#9b8168;cursor:pointer}
.demo select,.demo button{border:1px solid #e4d7c6;background:white;border-radius:8px;padding:8px;margin:8px 3px 0 0;font-size:11px}
.empty{padding:20px;border:1px dashed #dfcdb6;border-radius:16px;font-size:13px;color:#85715e}
.resultnote{font-size:11px;color:#9a8269;margin:0 0 12px}
#notice:empty{display:none}
#notice{background:#fff0ce;padding:12px;border-radius:12px;font-size:12px}
@media(min-width:650px){.phone{margin:24px auto;border-radius:32px;overflow:hidden;min-height:calc(100vh - 48px)}}
@media(max-width:350px){main{padding:18px 13px}.category span{width:45px}.shopgrid{gap:8px}.top{padding:22px 16px}}
form label{display:block;font-size:12px;margin:12px 0}
form input,form select{display:block;width:100%;margin-top:6px;border:1px solid #e0d3c1;border-radius:9px;padding:10px}
button,input,select,textarea{font-family:inherit}
h1,h2,h3,strong{font-weight:700}
h1,h2,h3{letter-spacing:0;line-height:1.45}
.top h1{font-size:32px;line-height:1.4;letter-spacing:0}
.brandline strong{font-size:21px}
.top p{font-size:14px}
.category{font-size:12px;line-height:1.5}
.shop h3{font-size:15px}
.shop p{font-size:12px;line-height:1.65}
.shop .price{font-size:18px}
.shop button,.card button,.primary{font-size:13px;font-weight:700}
.muted,.resultnote{font-size:12px;line-height:1.65}
.bottomnav button{font-size:11px;line-height:1.35}
.ad h2{font-size:24px}
.ad p,.textbtn{font-size:13px}
.newsrow h3{font-size:15px}
.newsrow p{font-size:12px}
.searchbox input{font-size:13px}
.demo summary{font-size:12px}
@media(max-width:350px){.category{font-size:11px}.top h1{font-size:29px}.brandline strong{font-size:19px}}
.post-announcement{display:block;width:100%;border:1px dashed #dc9567;color:#b35d32;background:#fff2d8;border-radius:13px;padding:13px;font-weight:700;margin-bottom:20px}
.media-picker{border:1px dashed #e4caa7;border-radius:13px;padding:12px;margin:18px 0}
.media-picker legend{font-weight:700;font-size:13px}
.attach-button{position:relative;display:flex!important;align-items:center;justify-content:center;gap:6px;min-height:48px;border:1px solid #e7cda8;border-radius:10px;background:#fff7e6;cursor:pointer;color:#a75c32}
.native-file{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.attach-button:focus-within{outline:3px solid #167b71}
.media-gallery{display:flex;gap:9px;overflow-x:auto;scroll-snap-type:x mandatory;width:100%;padding:4px}
.media-gallery img,.media-gallery video{width:100%;height:180px;object-fit:contain;border-radius:11px;background:#f1ece4;flex:0 0 100%;scroll-snap-align:start}
.media-item{flex:0 0 85%;min-width:0}
.media-item img,.media-item video{height:150px}
.remove-media{background:#fff0eb!important;color:#b45339!important;width:100%;padding:7px!important}
.media-cover{height:180px;display:block}
.media-cover .media-gallery{height:180px;padding:0}
.media-cover img,.media-cover video{height:180px;border-radius:0}
#mediaError{color:#b6422d;font-size:12px}
.verified-badge{display:inline-flex;align-items:center;gap:4px;color:#1677d2;font-size:12px;font-weight:700}
.verified-badge svg{width:21px;height:21px}
.verified-badge small{font-size:10px;color:#708399}
.rider-account{display:flex;align-items:center;gap:12px}
.rider-photo-thumb{height:48px;width:48px;flex-shrink:0;overflow:hidden;border-radius:13px}
.rider-photo-thumb img,.rider-photo-thumb svg{width:100%;height:100%;object-fit:cover}
.rating-summary{display:inline-flex;align-items:center;gap:4px;color:#bd791b;font-size:12px}
.rating-summary svg{width:19px;height:19px;fill:#efb94d;stroke:#ce8f25;stroke-width:1}
.rating-summary small{color:#8e816d;font-size:10px}
.rider-account{flex-wrap:wrap}
.rating-form fieldset{border:0;padding:0}
.rating-form legend{font-size:12px}
.star-options{display:flex;gap:7px;margin:12px 0}
.star-options label{flex:1;text-align:center;cursor:pointer;margin:0}
.star-options input{width:auto;display:inline}
.star-options span{display:flex;flex-direction:column;align-items:center;color:#8b8171}
.star-options svg{width:30px;height:30px;fill:none;stroke:#b8ac98;stroke-width:1.5}
.star-options label.selected svg{fill:#f2bb49;stroke:#d79b2d}
.star-options small{font-size:11px}
.support-entry,.support-actions{margin:18px 0}
.support-entry{display:flex;gap:8px}
.support-entry button,.support-button{border:1px solid #decdb7;background:#fffaf1;color:#98623c;border-radius:10px;padding:11px;font-size:12px;cursor:pointer}
.support-entry button{flex:1}
.complaint-button{color:#b04e40;border-color:#e2beb5}
.support-actions{padding:12px;border:1px solid #e5d8c5;border-radius:12px}
.support-actions .row{margin-top:8px}
textarea{width:100%;border:1px solid #e0d3c1;border-radius:9px;padding:10px;font:inherit;resize:vertical}
</style>
</head>
<body>
<div class="phone">
  <header class="top">
    <div class="brandline">
      <img class="logo" src="assets/logo-nong-ko.svg" alt="โลโก้สะพานสระหนองโก">
      <div>
        <div class="eyebrow">KRANUAN COMMUNITY</div>
        <strong>กระนวนใกล้บ้าน</strong>
      </div>
    </div>
    <h1>ทุกวันดี ๆ<br>เริ่มที่ใกล้บ้าน</h1>
    <p>ของอร่อย ร้านดี และบริการจากคนในชุมชน</p>
    <div class="location" id="location"></div>
    <div class="searchbox"><span id="searchIcon"></span><input id="search" aria-label="ค้นหาร้านและบริการ" placeholder="วันนี้กำลังมองหาอะไรในกระนวน?"></div>
  </header>
  <main>
    <div id="notice" role="status"></div>
    <div id="app"></div>
    <details class="demo">
      <summary>ต้นแบบ · ข้อมูลสมมติ / เครื่องมือทดลอง</summary>
      <p class="muted">ยังไม่มีการซื้อขาย ส่งงาน หรือเชื่อม LINE จริง</p>
      <label class="muted">บทบาททดลอง 
        <select id="role" aria-label="บทบาททดลอง">
          <option>ร้านค้า</option>
          <option value="ร้านรับงาน">ร้าน / ผู้ขายรับงาน</option>
          <option>ผู้ดูแล</option>
        </select>
      </label>
      <button onclick="resetDemo()">ล้างข้อมูลทดลอง</button>
      <p><a href="rider/index.html">เปิดแอพกระนวนไรเดอร์ (แยกต่างหาก)</a></p>
    </details>
  </main>
  <nav id="nav" class="bottomnav" aria-label="เมนูหลัก"></nav>
</div>

<script src="assets/delivery-pricing.js"></script>
<script>
const areaId='khon-kaen-kranuan',key='kranuan-isolated-demo-v1';
let state={orders:[],rider:'none',news:false};
try{let s=JSON.parse(localStorage.getItem(key));if(s&&Array.isArray(s.orders))state={...state,...s}}catch{}
let view='ร้านค้า',query='',category='ทั้งหมด';

// 📍 ตัวแปรเก็บพิกัด GPS ปัจจุบันของผู้ใช้ (ค่าเริ่มต้นกันเหนียวไว้ที่กระนวน)
let userLiveLocation = { lat: 16.706, lng: 103.078 };

// ขอสิทธิ์เข้าถึงพิกัด GPS อัตโนมัติทันทีที่เปิดแอพ
function initUserLocation() {
  if ("geolocation" in navigator) {
    navigator.geolocation.getCurrentPosition(
      (position) => {
        userLiveLocation = {
          lat: position.coords.latitude,
          lng: position.coords.longitude
        };
        console.log("📍 ดึงพิกัด GPS สำเร็จ:", userLiveLocation);
      },
      (error) => {
        console.warn("ไม่สามารถดึงพิกัดอัตโนมัติได้:", error.message);
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
  }
}
initUserLocation();

const sample=[{name:'ครัวชุมชน (สมมติ)',category:'อาหาร'},{name:'ช่างใกล้บ้าน (สมมติ)',category:'บริการ'}];
const statuses={waiting:'รอร้านรับออเดอร์',ready:'รอไรเดอร์',assigned:'ไรเดอร์รับงานแล้ว',picked:'รับสินค้าจากร้านแล้ว',done:'ส่งสำเร็จ',cancelled:'ยกเลิกแล้ว'};

function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{document.getElementById('notice').textContent='บันทึกไม่ได้ ข้อมูลอยู่เฉพาะหน้านี้'}render()}

function advance(id,next){
  let o=state.orders.find(o=>o.id===id&&o.areaId===areaId);
  if(o?.status==='seller'&&['ready','cancelled'].includes(next)){o.status=next;save();return}
  let allowed={waiting:['ready','cancelled'],ready:['assigned'],assigned:['picked'],picked:['done']};
  if(!o||!allowed[o.status]?.includes(next))return;
  if(['assigned','picked','done'].includes(next)&&state.rider!=='approved')return;
  o.status=next;save();
}

function render(){
  document.getElementById('nav').innerHTML=['ร้านค้า','ข่าว','ออเดอร์ของฉัน','ร้านรับงาน','ไรเดอร์','ผู้ดูแล'].map(x=>'<button onclick="view=&quot;'+x+'&quot;;render()">'+x+'</button>').join('');
  let h='<h2>'+view+'</h2>';
  if(view==='ร้านค้า')h+='<div class="row"><input id="search" aria-label="ค้นหาร้าน" placeholder="ค้นหาร้านหรือบริการ"><select id="category" aria-label="หมวดหมู่"><option>ทั้งหมด</option><option>อาหาร</option><option>บริการ</option></select></div><div id="results"></div>';
  if(view==='ข่าว')h+=state.news?'<article class="card"><span class="badge">ข่าวสมมติ</span><h3>กิจกรรมชุมชนตัวอย่าง</h3><p>ข้อความทดสอบ ไม่ใช่ประกาศจริง</p><p class="muted">แหล่งที่มา: ข้อมูลจำลอง ไม่มีแหล่งข่าวจริง<br>อนุมัติในการสาธิตแล้ว ไม่มีวันจัดกิจกรรมจริง</p></article>':'<p class="card">ยังไม่มีข่าวที่อนุมัติ ลองอนุมัติข่าวตัวอย่างในหน้าผู้ดูแล</p>';
  if(['ออเดอร์ของฉัน','ร้านรับงาน'].includes(view))h+=orders();
  if(view==='ผู้ดูแล')h+='<p class="muted">หน้าจำลอง ไม่มีการตรวจสิทธิ์จริง</p><div class="card"><h3>กิจกรรมชุมชนตัวอย่าง</h3><p>แหล่งที่มา: ข้อมูลจำลอง ไม่มีแหล่งข่าวจริง</p><button onclick="approveNews()">'+(state.news?'อนุมัติข่าวแล้ว':'อนุมัติข่าวตัวอย่าง')+'</button></div><div class="card"><h3>ผู้สมัครไรเดอร์สมมติ</h3><p>พื้นที่กระนวน • '+state.rider+'</p><button onclick="approveRider()">อนุมัติไรเดอร์ที่สมัครแล้ว</button></div>';
  document.getElementById('app').innerHTML=h;
  if(view==='ร้านค้า'){let q=document.getElementById('search'),c=document.getElementById('category');q.value=query;c.value=category;q.oninput=()=>{query=q.value;results()};c.onchange=()=>{category=c.value;results()};results()}
}

function results(){
  document.getElementById('results').innerHTML=sample.filter(s=>s.name.includes(query)&&(category==='ทั้งหมด'||s.category===category)).map(s=>'<article class="card"><span class="badge">'+s.category+' • สมมติ</span><h3>'+s.name+'</h3><p>ช่องทางติดต่อ: ยังไม่มีข้อมูลจริง</p>'+(s.category==='อาหาร'?'<p>ข้าวกล่อง 50 + ค่าส่ง 10 = 60 บาท (สมมติ)</p><button onclick="createOrder()">สั่งข้าวกล่องทันที (ใช้พิกัด GPS ของคุณ)</button>':'<p>ตัวอย่างบริการซ่อมในชุมชน ยังไม่เปิดเดลิเวอรี่</p>')+'</article>').join('')||'<p>ไม่พบร้าน</p>'
}

// 🚀 ฟังก์ชันสั่งอาหาร: ดึงพิกัด GPS อัตโนมัติและส่งให้ไรเดอร์ทันที
function createOrder(){
  const pickupPoint = { lat: 16.706, lng: 103.078 }; // พิกัดร้านจำลอง
  const dropPoint = userLiveLocation;                // พิกัด GPS จริงของผู้ใช้ตอนนี้
  
  let km = 2.0;
  let quoteTotal = 10;
  try {
    km = KranuanPricing.haversine(pickupPoint, dropPoint);
    const q = KranuanPricing.quote(km);
    quoteTotal = q.total;
  } catch(e) {}

  const newOrder = {
    id: Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8),
    areaId,
    status: 'waiting',
    type: 'food',
    item: 'ข้าวกล่องตัวอย่าง 1 กล่อง',
    deliveryFee: quoteTotal,
    coordinates: {
      pickup: pickupPoint,
      drop: dropPoint,
      isSample: false
    }
  };

  state.orders.push(newOrder);
  view='ออเดอร์ของฉัน';
  save();
  document.getElementById('notice').textContent='ส่งออเดอร์สำเร็จ! แนบพิกัด GPS ของคุณให้ไรเดอร์นำทางแล้ว (ระยะทางประมาณ ' + km.toFixed(1) + ' กม.)';
}

function action(o,next,label){return '<button onclick="advance(&quot;'+o.id+'&quot;,&quot;'+next+'&quot;)">'+label+'</button> '}

function orders(){
  return state.orders.filter(o=>o.areaId===areaId&&(view!=='ไรเดอร์'||['ready','assigned','picked','done'].includes(o.status))).map(o=>{
    let distanceHtml = '';
    let navButton = '';
    if (o.coordinates && o.coordinates.pickup && o.coordinates.drop) {
      try {
        const km = KranuanPricing.haversine(o.coordinates.pickup, o.coordinates.drop);
        distanceHtml = '<p>📍 ระยะทางจัดส่ง: <strong>' + km.toFixed(1) + ' กม.</strong></p>';
        const lat = o.coordinates.drop.lat;
        const lng = o.coordinates.drop.lng;
        navButton = '<button type="button" onclick="window.open(\'https://www.google.com/maps/dir/?api=1&destination=' + lat + ',' + lng + '&travelmode=driving\', \'_blank\')" style="background:#00c853; color:white; border:none; padding:10px 15px; border-radius:8px; font-weight:bold; width:100%; margin-top:8px;">🗺️ เปิด Google Maps นำทางไปส่งลูกค้า</button>';
      } catch(e) {}
    }

    return '<article class="card"><span class="badge">'+(o.type==='market'?'รับ–ส่งของจากตลาด':'อาหารจากร้าน')+' · GPS จริง</span>'+
           '<h3>'+escapeHtml(o.item||'ข้าวกล่องตัวอย่าง 1 กล่อง')+'</h3>'+
           '<p>ราคาค่าส่งประมาณการ '+Number(o.deliveryFee||10)+' บาท</p>'+
           distanceHtml +
           '<p class="status">'+statuses[o.status]+'</p>'+
           '<p class="muted">ใช้พิกัด GPS ปัจจุบันของผู้ซื้อจริง</p>'+
           navButton +
           (view==='ร้านรับงาน'&&o.status==='seller'?action(o,'ready','ผู้ขายยืนยันพร้อมส่ง')+action(o,'cancelled','ผู้ขายปฏิเสธ'):'')+
           (view==='ร้านรับงาน'&&o.status==='waiting'?action(o,'ready','ร้านรับออเดอร์')+action(o,'cancelled','ร้านปฏิเสธ'):'')+
           (view==='ออเดอร์ของฉัน'&&['waiting','seller'].includes(o.status)?action(o,'cancelled','ยกเลิกคำขอ'):'')+
           (view==='ไรเดอร์'&&o.status==='ready'?action(o,'assigned','รับงานนี้'):'')+
           (view==='ไรเดอร์'&&o.status==='assigned'?action(o,'picked','รับของจากต้นทางแล้ว'):'')+
           (view==='ไรเดอร์'&&o.status==='picked'?action(o,'done','ยืนยันส่งสำเร็จ'):'')+
           '</article>';
  }).join('')||'<p class="empty">ยังไม่มีงานในขั้นตอนนี้</p>';
}

  }
}

function icon(k){return '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">'+paths[k]+'</svg>'}
function go(v){if(v==='ไรเดอร์'){location.href='rider/index.html';return}view=v;render();window.scrollTo({top:0,behavior:'smooth'})}
function setCategory(c){category=c;view=c==='ตลาด'?'ตลาด':'ร้านค้า';render()}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function topNav(){
  document.getElementById('nav').innerHTML=[['ร้านค้า','home','หน้าแรก'],['ตลาด','market','ตลาด'],['ออเดอร์ของฉัน','orders','งานของฉัน'],['ข่าว','news','ข่าวชุมชน'],['เรียกไรเดอร์','rider','ส่งของ']].map(([v,k,l])=>'<button class="'+(view===v?'active':'')+'" data-view="'+v+'" onclick="go(this.dataset.view)">'+icon(k)+l+'</button>').join('');
  document.getElementById('location').innerHTML=icon('pin')+'อ.กระนวน จ.ขอนแก่น';
  document.getElementById('searchIcon').innerHTML=icon('search');
  const q=document.getElementById('search');
  q.value=query;
  q.oninput=()=>{query=q.value;if(!['ร้านค้า','ตลาด'].includes(view)){view='ร้านค้า';render()}else if(view==='ร้านค้า')results();else marketResults()};
  const role=document.getElementById('role');
  role.value=['ร้านรับงาน','ไรเดอร์','ผู้ดูแล'].includes(view)?view:'ร้านค้า';
  role.onchange=()=>go(role.value)
}

const originalRender=render;
state.listings=Array.isArray(state.listings)?state.listings:[{id:'market-demo',areaId,title:'โต๊ะไม้สำหรับมุมทำงาน (สมมติ)',price:350,condition:'มือสอง สภาพดี',detail:'ประกาศตัวอย่างจากคนในพื้นที่',status:'approved',isSample:true}];

render=function(){
  if(!['ร้านค้า','ตลาด','เรียกไรเดอร์'].includes(view)){
    originalRender();
    if(view==='ผู้ดูแล')document.getElementById('app').insertAdjacentHTML('beforeend',pendingListings());
    topNav();
    return;
  }
  let h=categoryBar();
  if(view==='ร้านค้า'){
    h+='<section class="ad" aria-label="พื้นที่แบนเนอร์โฆษณาตัวอย่าง"><div class="adcopy"><small>LOCAL SPOTLIGHT · พื้นที่โฆษณา</small><h2>ร้านใกล้บ้าน<br>ให้เราได้รู้จักกัน</h2><p>พื้นที่แนะนำร้านค้าในกระนวน</p><button onclick="adInfo()">ดูรายละเอียดพื้นที่โฆษณา</button></div>'+foodArt()+'</section><p class="muted" style="text-align:center">แบนเนอร์โฆษณาตัวอย่าง</p><div class="sectionhead"><h2>ร้านน่าแวะใกล้คุณ</h2><button class="textbtn" onclick="category=\'ทั้งหมด\';query=\'\';render()">ดูทั้งหมด</button></div><p class="resultnote">ร้านและภาพประกอบเป็นตัวอย่าง</p><div id="results" class="shopgrid"></div><div class="sectionhead"><h2>เรื่องราวในชุมชน</h2><button class="textbtn" onclick="go(\'ข่าว\')">ดูข่าว</button></div><div class="newsrow">'+icon('news')+'<div><h3>ข่าว ประกาศ และกิจกรรม</h3><p>ตรวจสอบแหล่งที่มา ก่อนส่งต่อเรื่องราวดี ๆ</p></div></div>'
  }
  if(view==='ตลาด')h+='<div class="sectionhead"><h2>ตลาดของคนกระนวน</h2><button class="textbtn" onclick="listingForm()">ลงประกาศขาย</button></div><p class="resultnote">ของใหม่หรือมือสอง ลงขายกันเองในชุมชน</p><div id="marketForm"></div><div id="marketResults" class="shopgrid"></div>';
  if(view==='เรียกไรเดอร์')h+='<div class="sectionhead"><h2>ให้ไรเดอร์ช่วยรับ–ส่ง</h2></div><div class="card">'+icon('rider')+'<h3>รับของจากร้าน หรือจากคนในตลาด</h3><p>งานตลาดต้องให้ผู้ขายยืนยันว่าพร้อมส่งก่อน จึงเปิดงานให้ไรเดอร์ที่อนุมัติแล้วรับได้</p><p class="muted">ต้นแบบใช้จุดรับ–ส่งและค่าบริการจำลอง ไม่เก็บที่อยู่จริง</p><button onclick="go(\'ตลาด\')">เลือกของจากตลาด</button></div>';
  document.getElementById('app').innerHTML=h;
  topNav();
  if(view==='ร้านค้า')results();
  if(view==='ตลาด')marketResults()
}

function categoryBar(){
  return '<div class="categories">'+[['อาหาร','food'],['เครื่องดื่ม','drink'],['บริการ','service'],['ตลาด','market'],['เรียกไรเดอร์','rider']].map(([label,k])=>'<button class="category '+(category===label?'selected':'')+'" onclick="chooseCategory(this.dataset.category)" data-category="'+label+'"><span>'+icon(k)+'</span>'+label+'</button>').join('')+'</div>'
}
function chooseCategory(c){if(c==='เรียกไรเดอร์'){go('เรียกไรเดอร์');return}setCategory(c)}

function foodArt(){return '<svg viewBox="0 0 180 140" class="art" aria-hidden="true"><ellipse cx="90" cy="115" rx="68" ry="12" fill="#482d1d" opacity=".1"/><ellipse cx="90" cy="90" rx="68" ry="32" fill="#fffdf0"/><ellipse cx="90" cy="85" rx="54" ry="24" fill="#e9d2a0"/><path d="M45 86q5-55 55-40 27 12 25 40" fill="#fff5d8"/><path d="m73 68 26-19 32 17-22 27-27-2Z" fill="#b96531"/><path d="m79 67 23-14m-16 22 27-16m-18 24 25-17" stroke="#f9c068" stroke-width="4"/><g fill="#5a8946"><ellipse cx="48" cy="87" rx="10" ry="18" transform="rotate(-30 48 87)"/><ellipse cx="59" cy="91" rx="9" ry="16" transform="rotate(30 59 91)"/></g><circle cx="127" cy="84" r="13" fill="#e76535"/><circle cx="127" cy="84" r="8" fill="#f9bc68"/><path d="M73 25q-8-8 0-16m17 19q-8-8 0-16" fill="none" stroke="#fff4d6" stroke-width="3" stroke-linecap="round"/></svg>'}

  return '<svg viewBox="0 0 180 140" aria-hidden="true"><ellipse cx="90" cy="115" rx="56" ry="9" fill="#724e2d" opacity=".1"/>'+(type==='market'?'<path d="M49 51h82v56H49z" fill="#c88d50"/><path d="m49 51 41-22 41 22-41 22Z" fill="#e7b77a"/><path d="M90 73v34" stroke="#aa713c" stroke-width="3"/><path d="m70 40 40 23v18l-15-8V55" fill="#fff0cb"/><circle cx="130" cy="39" r="22" fill="#fff8e4"/><path d="m120 39 7 7 14-15" fill="none" stroke="#799174" stroke-width="4"/>':'<circle cx="90" cy="72" r="43" fill="#f6d49e"/><path d="m65 96 35-36m-2-19a19 19 0 0 0-19 26L58 88a9 9 0 0 0 13 13l24-24a19 19 0 0 0 24-23l-13 13-12-12 13-13" fill="#ee7645" stroke="#fff2d4" stroke-width="3"/>')+'</svg>'
}

function adInfo(){document.getElementById('notice').textContent='พื้นที่โฆษณาตัวอย่าง ยังไม่มีผู้ลงโฆษณา อัตราค่าโฆษณา หรือระบบซื้อโฆษณา';window.scrollTo({top:180,behavior:'smooth'})}
function serviceInfo(){document.getElementById('notice').textContent='ช่างใกล้บ้าน (สมมติ): ตัวอย่างบริการซ่อมทั่วไป ยังไม่มีเบอร์ติดต่อจริง'}

function marketResults(){
  document.getElementById('marketResults').innerHTML=state.listings.filter(l=>l.areaId===areaId&&l.status==='approved'&&l.title.includes(query)).map(l=>'<article class="shop"><div class="cover" style="background:#e7eadb"><span class="sampletag">ประกาศทดลอง</span>'+objectArt('market')+'</div><div class="shopbody"><p>'+escapeHtml(l.condition)+' · กระนวน</p><h3>'+escapeHtml(l.title)+'</h3><p>'+escapeHtml(l.detail)+'</p><span class="price">'+Number(l.price).toLocaleString('th-TH')+' บาท</span><button onclick="sellerContact()">ติดต่อผู้ขาย</button><button data-id="'+escapeHtml(l.id)+'" onclick="requestMarketDelivery(this.dataset.id)">เรียกไรเดอร์รับ–ส่งของ</button></div></article>').join('')||'<p class="empty">ยังไม่มีประกาศที่ตรงกับคำค้น</p>'
}

function sellerContact(){document.getElementById('notice').textContent='ประกาศทดลอง ยังไม่มีช่องทางติดต่อจริง ระบบจริงจะแสดงช่องทางที่ผู้ขายอนุญาต'}

function listingForm(){
  document.getElementById('marketForm').innerHTML='<form class="card" id="listingForm"><h3>ลงประกาศทดลอง</h3><p class="muted">ไม่ใส่ข้อมูลส่วนตัวจริง ประกาศต้องผ่านผู้ดูแล</p><label>ชื่อสินค้า<input name="title" maxlength="80" required></label><label>ราคา (บาท)<input name="price" type="number" min="1" max="1000000" required></label><label>สภาพสินค้า<select name="condition"><option>ของใหม่</option><option>มือสอง</option></select></label><label>รายละเอียด<input name="detail" maxlength="240" required></label><button type="submit">ส่งให้ผู้ดูแลตรวจ</button></form>';
  document.getElementById('listingForm').onsubmit=e=>{
    e.preventDefault();
    const data=new FormData(e.target);
    state.listings.push({id:'L'+Date.now(),areaId,title:String(data.get('title')).trim(),price:Number(data.get('price')),condition:String(data.get('condition')),detail:String(data.get('detail')).trim(),status:'pending',isSample:true});
    save();document.getElementById('notice').textContent='ส่งประกาศทดลองแล้ว รออนุมัติในหน้าผู้ดูแล'
  }
}

function pendingListings(){
  return '<h2 style="margin-top:24px">ประกาศตลาดรอตรวจ</h2>'+state.listings.filter(l=>l.areaId===areaId&&l.status==='pending').map(l=>'<div class="card"><h3>'+escapeHtml(l.title)+'</h3><p>'+escapeHtml(l.detail)+' · '+Number(l.price)+' บาท</p><button data-id="'+escapeHtml(l.id)+'" onclick="reviewListing(this.dataset.id, true)">อนุมัติประกาศ</button> <button data-id="'+escapeHtml(l.id)+'" onclick="reviewListing(this.dataset.id, false)">ไม่อนุมัติ</button></div>').join('')
}

function reviewListing(id,approve){
  const l=state.listings.find(l=>l.id===id&&l.areaId===areaId&&l.status==='pending');
  if(l){l.status=approve?'approved':'rejected';save()}
}

statuses.seller='รอผู้ขายยืนยันพร้อมส่ง';

function requestMarketDelivery(id){
  const l=state.listings.find(l=>l.id===id&&l.areaId===areaId&&l.status==='approved');
  if(!l)return;
  
  const pickupPoint = { lat: 16.706, lng: 103.078 };
  const dropPoint = userLiveLocation;

  state.orders.push({
    id:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8),
    areaId,
    status:'seller',
    type:'market',
    item:l.title,
    itemPrice:l.price,
    deliveryFee:20,
    coordinates: {
      pickup: pickupPoint,
      drop: dropPoint,
      isSample: false
    }
  });
  go('ออเดอร์ของฉัน');save();
  document.getElementById('notice').textContent='คำขอตลาดสำเร็จ: แนบพิกัด GPS จริงของคุณส่งให้ไรเดอร์แล้ว'
}

function orderTipHtml(o){
  if(o.status!=='done')return '';
  const amount=o.tip?.status==='recorded_demo'?o.tip.amount:null;
  return '<section class="card"><span class="badge">ขอบคุณไรเดอร์ · ทิปโดยสมัครใจ</span><h3>'+escapeHtml(o.item||'ข้าวกล่องตัวอย่าง')+'</h3>'+(amount!==null?'<p class="status">บันทึกทิปทดลอง '+Number(amount)+' บาทแล้ว</p><p class="muted">ไม่มีการหักเงินหรือโอนเงินจริง</p>':'<p class="muted">ให้ทิปหลังส่งสำเร็จได้ ไม่บังคับ และแยกจากค่าส่ง</p><form data-id="'+escapeHtml(o.id)+'" onsubmit="submitDemoTip(event,this.dataset.id)"><div class="row">'+[10,20,50].map(n=>'<button type="button" data-id="'+escapeHtml(o.id)+'" data-tip="'+n+'" onclick="chooseTip(this.dataset.id,this.dataset.tip)">'+n+' บาท</button>').join('')+'</div><label>จำนวนทิปทดลอง (บาท)<input id="tip-'+escapeHtml(o.id)+'" type="number" min="0" max="10000" step="1" value="0" required></label><button type="submit">บันทึกทิปทดลอง</button><p class="muted">0 บาท = ไม่ให้ทิป · ยังไม่มีระบบรับชำระเงิน</p></form>')+'</section>'
}

function chooseTip(id,n){const el=document.getElementById('tip-'+id);if(el)el.value=n}

function recordDemoTip(id,value){
  const n=Number(value);
  if(value===''||!Number.isSafeInteger(n)||n<0||n>10000)return false;
  try{
    const latest=JSON.parse(localStorage.getItem(key));
    if(latest&&Array.isArray(latest.orders))state=latest;
  }catch{}
  const o=state.orders.find(o=>o.id===id&&o.areaId===areaId);
  if(!o)return false;
  o.tip={status:'recorded_demo',amount:n};
  save();
  return true;
}

function submitDemoTip(e,id){
  e.preventDefault();
  const val=document.getElementById('tip-'+id).value;
  if(recordDemoTip(id,val)){
    document.getElementById('notice').textContent='บันทึกทิปทดลองแล้ว';
    render();
  }else{
    document.getElementById('notice').textContent='จำนวนทิปไม่ถูกต้อง';
  }
}

render();
</script>
